name: Update Stats

# Runs weekly on Sunday at 3 AM or manually via dispatch
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install js-yaml
        
      - name: Fetch issue counts and stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-stats.js

      - name: Commit data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stats.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push